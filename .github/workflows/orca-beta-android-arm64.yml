name: Orca Beta Android ARM64 (fork artifact)

# Personal fork only: build an ARM64 APK artifact for local re-signing.
# Does NOT publish releases, does NOT use signing secrets, does NOT run on
# stablyai/orca. Trigger is the exact beta branch name so official
# mobile-android-v* / main / PR pipelines stay untouched.
on:
  push:
    branches:
      - andrerferrer/android-beta-30min
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-beta-android-arm64-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64-artifact:
    if: github.repository == 'andrerferrer/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mobile

    env:
      # Cap JS / native fan-out on the hosted runner (public ubuntu-latest).
      NODE_OPTIONS: --max-old-space-size=4096
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      NINJA_NUM_JOBS: '2'
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true

      - name: Setup pnpm (repo pin + integrity)
        uses: ./.github/actions/setup-pnpm

      - name: Install JS dependencies (frozen)
        # Root install: mobile prebuild resolves workspace packages from the monorepo.
        # Same shape as mobile-android-release.yml (working-directory defaults to mobile
        # for other steps; install must run at the workspace root).
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36, build-tools 36.0.0, NDK 27.1.12297006
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          # Prove the pin the build will see.
          sdkmanager --list_installed | tee "$RUNNER_TEMP/sdk-installed.txt"
          grep -F 'ndk;27.1.12297006' "$RUNNER_TEMP/sdk-installed.txt"
          grep -F 'build-tools;36.0.0' "$RUNNER_TEMP/sdk-installed.txt"
          grep -F 'platforms;android-36' "$RUNNER_TEMP/sdk-installed.txt"

      - name: Expo prebuild (android, no install)
        # app.json has no googleServicesFile (personal package; remote FCM stays off).
        # Identity already in source: com.andrerferrer.orca.beta / versionCode 27 / 0.0.62.
        run: npx expo prebuild --platform android --no-install

      - name: Pin Gradle workers + ARM64-only architectures
        run: |
          set -euo pipefail
          props=android/gradle.properties
          if grep -q '^reactNativeArchitectures=' "$props"; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' "$props"
          else
            echo 'reactNativeArchitectures=arm64-v8a' >> "$props"
          fi
          if grep -q '^org.gradle.workers.max=' "$props"; then
            sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' "$props"
          else
            echo 'org.gradle.workers.max=2' >> "$props"
          fi
          if grep -q '^org.gradle.jvmargs=' "$props"; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m/' "$props"
          else
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m' >> "$props"
          fi
          grep -E '^(reactNativeArchitectures|org.gradle.workers.max|org.gradle.jvmargs)=' "$props"

      - name: Use debug signing for CI release APK (no secrets)
        # Personal ORCA_BETA keystore never leaves the Mac. CI produces a
        # debug-signed release APK; local apksigner re-signs to the beta cert.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          old = 'signingConfig signingConfigs.beta'
          new = 'signingConfig signingConfigs.debug'
          if old not in text:
              raise SystemExit('expected release beta signingConfig mapping missing')
          path.write_text(text.replace(old, new, 1))
          print('release buildType now uses signingConfigs.debug for CI artifact')
          PY

      - name: Prove native job cap wiring before Gradle
        run: |
          set -euo pipefail
          echo "CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL}"
          echo "NINJA_NUM_JOBS=${NINJA_NUM_JOBS}"
          test "$CMAKE_BUILD_PARALLEL_LEVEL" = "2"
          test "$NINJA_NUM_JOBS" = "2"
          # Also pass -j2 through common CMake/ninja env used by AGP externalNativeBuild.
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

      - name: Build ARM64 assembleRelease (debug-signed, no daemon)
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -PreactNativeArchitectures=arm64-v8a

      - name: Checksum APK + record identity hints
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            ls -la android/app/build/outputs/apk/release/ >&2 || true
            exit 1
          fi
          apk="${apks[0]}"
          bytes="$(wc -c < "$apk" | tr -d ' ')"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          printf '%s *%s\n' "$sha256" "$(basename "$apk")" > "$apk.sha256"
          {
            echo "path=$apk"
            echo "bytes=$bytes"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "CI APK $bytes bytes sha256=$sha256"
          # Best-effort aapt dump when build-tools are on PATH.
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$apk" | tee "$RUNNER_TEMP/aapt-badging.txt" | head -20
          else
            AAPT="$(ls -d "$ANDROID_HOME"/build-tools/36.0.0/aapt 2>/dev/null || true)"
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$apk" | tee "$RUNNER_TEMP/aapt-badging.txt" | head -20
            fi
          fi

      - name: Upload APK artifact (no release, no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: orca-beta-relay-30min-arm64-debugsigned
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
