name: Orca Beta Android ARM64 (fork artifact)

# Personal fork only: build an ARM64 APK artifact for local re-signing.
# Does NOT publish releases, does NOT use signing secrets, does NOT run on
# stablyai/orca. Trigger is the exact beta branch name so official
# mobile-android-v* / main / PR pipelines stay untouched.
#
# android/ is gitignored: this job runs a fresh `expo prebuild` and uses the
# generated template signing (debug / unsigned-style release). Do not expect
# the Mac-only signingConfigs.beta patch. Personal re-sign happens locally
# after downloading the artifact.
on:
  push:
    branches:
      - andrerferrer/android-beta-30min
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-beta-android-arm64-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64-artifact:
    # Exact fork + exact branch (covers workflow_dispatch as well as push).
    if: github.repository == 'andrerferrer/orca' && github.ref == 'refs/heads/andrerferrer/android-beta-30min'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mobile

    env:
      # Hosted ubuntu-latest limits we actually set (Gradle workers / JVM / Node).
      # Do not claim a Ninja/clang job cap here — env-only Ninja caps were refuted
      # on the Mac (12× clang++). Public runners are typically ~4 CPUs.
      NODE_OPTIONS: --max-old-space-size=4096
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      # mobile/beta/with-orca-beta.cjs applies the Beta identity only under this flag.
      ORCA_BETA: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true

      - name: Setup pnpm (repo pin + integrity)
        uses: ./.github/actions/setup-pnpm

      - name: Install root JS dependencies (frozen)
        # Root workspace excludes mobile's own lockfile; still needed for shared packages.
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install mobile JS dependencies (frozen)
        # mobile/ has its own pnpm-workspace.yaml + lockfile (Expo/RN). Match
        # mobile-android-release.yml: install under mobile before prebuild.
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK cmdline-tools
        # Default packages include obsolete `tools`, which sdkmanager no longer
        # resolves (run 41767295480: Warning: Failed to find package 'tools').
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform 36, build-tools 36.0.0, NDK 27.1.12297006
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          sdkmanager --list_installed > "$RUNNER_TEMP/sdk-installed.txt"
          grep -F 'ndk;27.1.12297006' "$RUNNER_TEMP/sdk-installed.txt"
          grep -F 'build-tools;36.0.0' "$RUNNER_TEMP/sdk-installed.txt"
          grep -F 'platforms;android-36' "$RUNNER_TEMP/sdk-installed.txt"

      - name: Expo prebuild (android, no install)
        # ORCA_BETA=1: identity from mobile/beta/orca-beta.json (package, versionCode, icons),
        # googleServicesFile dropped (personal package; remote FCM stays off).
        # Fresh android/ from the template — not the Mac gitignored tree.
        # Use the Expo from mobile's frozen lockfile (pnpm exec), not npx fetch.
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Confirm generated signing (no beta keystore assumption)
        run: |
          set -euo pipefail
          # Fresh prebuild must not reference the Mac-only ORCA_BETA / signingConfigs.beta patch.
          if grep -n 'signingConfigs\.beta\|ORCA_BETA_STORE_FILE' android/app/build.gradle; then
            echo "Fresh prebuild unexpectedly contains beta signing patch" >&2
            exit 1
          fi
          # Expo template release builds typically map to signingConfigs.debug when
          # no credentials are configured — that is the CI artifact we re-sign locally.
          grep -n 'signingConfig' android/app/build.gradle || true

      - name: Pin Gradle workers + ARM64-only architectures
        run: |
          set -euo pipefail
          props=android/gradle.properties
          if grep -q '^reactNativeArchitectures=' "$props"; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' "$props"
          else
            echo 'reactNativeArchitectures=arm64-v8a' >> "$props"
          fi
          if grep -q '^org.gradle.workers.max=' "$props"; then
            sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' "$props"
          else
            echo 'org.gradle.workers.max=2' >> "$props"
          fi
          if grep -q '^org.gradle.jvmargs=' "$props"; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m/' "$props"
          else
            echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m' >> "$props"
          fi
          grep -E '^(reactNativeArchitectures|org.gradle.workers.max|org.gradle.jvmargs)=' "$props"

      - name: Build ARM64 assembleRelease (template signing, no daemon)
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -PreactNativeArchitectures=arm64-v8a

      - name: Checksum APK + assert package / versionCode / ABI / bundle
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            ls -la android/app/build/outputs/apk/release/ >&2 || true
            exit 1
          fi
          apk="${apks[0]}"
          bytes="$(wc -c < "$apk" | tr -d ' ')"
          sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          printf '%s *%s\n' "$sha256" "$(basename "$apk")" > "$apk.sha256"
          {
            echo "path=$apk"
            echo "bytes=$bytes"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "CI APK $bytes bytes sha256=$sha256"

          AAPT="$(command -v aapt || true)"
          if [ -z "$AAPT" ]; then
            AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          fi
          test -x "$AAPT"
          # Write the full dump first — never aapt|tee|head under pipefail (head closes the pipe).
          "$AAPT" dump badging "$apk" > "$RUNNER_TEMP/aapt-badging.txt"
          head -n 40 "$RUNNER_TEMP/aapt-badging.txt"

          grep -F "package: name='com.andrerferrer.orca.beta'" "$RUNNER_TEMP/aapt-badging.txt"
          version_code="$(node -p "require('./beta/orca-beta.json').versionCode")"
          grep -E "versionCode='${version_code}'" "$RUNNER_TEMP/aapt-badging.txt"
          grep -E "native-code:.*'arm64-v8a'" "$RUNNER_TEMP/aapt-badging.txt"
          # Embedded release JS bundle (Metro not required at runtime).
          unzip -l "$apk" > "$RUNNER_TEMP/apk-listing.txt"
          grep -E 'assets/index\.android\.bundle' "$RUNNER_TEMP/apk-listing.txt"

      - name: Upload APK artifact (no release, no secrets)
        uses: actions/upload-artifact@v7
        with:
          name: orca-beta-relay-30min-arm64-ci
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
